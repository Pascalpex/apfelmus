# All options: https://docs.zephyrproject.org/latest/kconfig.html

# Networking: IPv4 + UDP sockets
CONFIG_NETWORKING=y
CONFIG_NET_IPV4=y
CONFIG_NET_IPV6=n
CONFIG_NET_SOCKETS=y
CONFIG_NET_UDP=y

# IP address from the router via DHCP, wait for it at boot
CONFIG_NET_DHCPV4=y
CONFIG_NET_CONFIG_SETTINGS=y
CONFIG_NET_CONFIG_NEED_IPV4=y

# Reachable as apfelmus.local
CONFIG_NET_HOSTNAME_ENABLE=y
CONFIG_NET_HOSTNAME="apfelmus"
CONFIG_MDNS_RESPONDER=y

CONFIG_LOG=y

# On-board LED
CONFIG_GPIO=y
