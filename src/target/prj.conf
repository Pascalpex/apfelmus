# All options: https://docs.zephyrproject.org/latest/kconfig.html

# Networking: IPv4 + UDP sockets
CONFIG_NETWORKING=y
CONFIG_NET_IPV4=y
CONFIG_NET_IPV6=n
CONFIG_NET_SOCKETS=y
CONFIG_NET_UDP=y
# POSIX socket names (socket, bind, recvfrom, sendto)
CONFIG_POSIX_API=y

# Wait for an IPv4 address at boot
CONFIG_NET_CONFIG_SETTINGS=y
CONFIG_NET_CONFIG_NEED_IPV4=y

# --- DHCP ---
CONFIG_NET_DHCPV4=y

# --- static IP ---
#CONFIG_NET_CONFIG_MY_IPV4_ADDR="192.168.77.2"
#CONFIG_NET_CONFIG_MY_IPV4_NETMASK="255.255.255.0"

# Reachable as apfelmus.local
CONFIG_NET_HOSTNAME_ENABLE=y
CONFIG_NET_HOSTNAME="apfelmus"
CONFIG_MDNS_RESPONDER=y

CONFIG_LOG=y

# On-board LED
CONFIG_GPIO=y

# Emulated sensor options: emul/emul.conf
CONFIG_I2C=y
